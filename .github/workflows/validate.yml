name: Validate

# This marketplace auto-updates onto users' machines: `thinqos install` registers
# it with `autoUpdate: true`, so whatever lands on main reaches every installed
# user with no review gate and no rollback. Everything that can brick a session
# is gated here before merge.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Manifests, scripts, version bump
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history: the version-bump guard diffs against the PR base.
          fetch-depth: 0

      - name: Validate manifests (marketplace, plugin, hooks, skills)
        run: python3 scripts/validate-manifests.py

      - name: Validate the Agent Plugins package against the published schemas
        # plugin.json and mcp.json are what ChatGPT, Codex, Cursor and Copilot
        # read. Both schemas are closed, so an unknown field rejects the plugin.
        run: |
          set -e
          base=https://agent-plugins.org/schemas/1.0.0
          for dir in plugins/*/; do
            pipx run check-jsonschema --schemafile "$base/plugin.schema.json" "${dir}plugin.json"
            pipx run check-jsonschema --schemafile "$base/mcp.schema.json" "${dir}mcp.json"
          done

      - name: Ensure shellcheck is available
        run: shellcheck --version || sudo apt-get install -y shellcheck

      - name: Shellcheck hook scripts
        run: |
          files=$(git ls-files '*.sh')
          if [ -z "$files" ]; then
            echo "no shell scripts tracked; nothing to check"
            exit 0
          fi
          echo "$files"
          # shellcheck disable=SC2086
          shellcheck $files

      - name: CLI compatibility conformance tests
        # Run under dash, not bash: the hooks execute under whatever /bin/sh
        # the user's machine provides, so a bashism that passes in a developer
        # shell and breaks in dash must fail here rather than in a session.
        run: dash tests/test-cli-compat.sh

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Install Claude Code CLI
        # Intentionally unpinned: this gate should notice a new manifest
        # requirement in CI rather than in a user's broken session.
        run: npm install -g @anthropic-ai/claude-code

      - name: Run `claude plugin validate` on the marketplace and every plugin
        run: |
          set -e
          # A broken marketplace manifest is worse than a broken plugin: it
          # takes the whole catalog down for every installed user at once.
          echo "== marketplace"
          claude plugin validate .
          for dir in plugins/*/; do
            echo "== ${dir%/}"
            claude plugin validate "./${dir%/}"
          done

      - name: Version-bump guard
        if: github.event_name == 'pull_request'
        run: |
          python3 scripts/check-version-bump.py \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}"
